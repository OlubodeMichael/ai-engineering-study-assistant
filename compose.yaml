services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      chroma:
        condition: service_started
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    pull_policy: never
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma-data:/data
    restart: unless-stopped

volumes:
  chroma-data:
    external: true
    name: course-chroma-data